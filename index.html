
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的第一个网页</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
      color: #26324a;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    main {
      max-width: 500px;
      margin: auto;
      padding: 36px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px #00000015;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #5865e8;
      color: white;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: #4752c4;
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }
      main {
        padding: 24px;
        margin: 0 10px;
      }
      body {
        padding: 30px 10px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>你好，我是黯水晶！👋</h1>
    <p>这是我的第一个网页。</p>
    <button onclick="alert('恭喜你，网页运行成功！')">
      点击试试
    </button>
  </main>
</body>
</html>
