
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的第一个网页</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #eef2ff;
      color: #26324a;
      text-align: center;
      padding: 70px 20px;
    }

    main {
      max-width: 500px;
      margin: auto;
      padding: 36px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px #00000015;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #5865e8;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>你好，世界！👋</h1>
    <p>这是我的第一个网页。</p>
    <button onclick="alert('恭喜你，网页运行成功！')">
      点击试试
    </button>
  </main>
</body>
</html>
