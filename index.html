
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的第一个网页</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
      color: #26324a;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    main {
      max-width: 500px;
      margin: auto;
      padding: 36px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px #00000015;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #5865e8;
      color: white;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: #4752c4;
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }
      main {
        padding: 24px;
        margin: 0 10px;
      }
      body {
        padding: 30px 10px;
      }
    }

    .hero img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #fff;
      display: block;
      margin: 0 auto 16px;
    }

    .hero h1 {
      margin-bottom: 8px;
    }

    .hero .subtitle {
      color: #6b7280;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 24px 0;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #e0e7ff;
    }

    .card h2 {
      margin-top: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111827;
      }
      .card {
        background: #1f2937;
        border-color: #e5e7eb;
      }
      body, .hero .subtitle {
        color: #e5e7eb;
      }
    }

    @media (max-width: 640px) {
      .hero img {
        width: 88px;
        height: 88px;
      }
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <img src="assets/avatar.jpg" alt="avatar">
      <h1>黯水晶</h1>
      <p class="subtitle">在学习前端的鲸鱼娘</p>
    </section>
    <section class="cards">
      <div class="card">
        <h2>关于我</h2>
        <p>占位文字1</p>
        <p>占位文字2</p>
        <p>占位文字3</p>
      </div>
      <div class="card">
        <h2>我正在学什么</h2>
        <ul>
          <li>HTML</li>
          <li>CSS</li>
          <li>Git</li>
          <li>GitHub Pages</li>
        </ul>
      </div>
      <div class="card">
        <h2>联系我</h2>
        <p><a href="https://github.com/anshuijingli-boop" target="_blank" rel="noopener noreferrer">GitHub</a></p>
      </div>
    </section>
    <footer>© 2026 黯水晶</footer>
  </main>
</body>
</html>
